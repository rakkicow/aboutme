<style>
@import "https://fonts.googleapis.com/css?family=Lato:300";
@import "https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.9/css/weather-icons.min.css";
html, body, .background {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: 'Lato', sans-serif;
}

html {
  background: #fff;
}

/* Nothing on this page may ever scroll sideways. The zoomed overlay canvases
   are fixed-position and deliberately larger than the viewport, so they get
   clipped here rather than growing the page. */
html, body {
  overflow-x: hidden;
  max-width: 100%;
}

/* The page's colour now lives entirely in the .sky-layer panes below, so these
   stay transparent and nothing repaints when the sky changes. */
body {
  background: transparent;
}

.background {
  background: transparent;
}

.sky-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--sky-fade, 1.4s) ease;
  will-change: opacity;
}
/* Daylight: the three original gradients, stacked in one pane. */
#sky-day {
  opacity: 1;
  background:
    linear-gradient(240deg, rgba(150, 50, 50, 0.3), rgba(0, 0, 200, 0)),
    linear-gradient(120deg, rgba(50, 150, 100, 0.2), rgba(0, 0, 100, 0)),
    linear-gradient(0deg, rgba(0, 0, 200, 0.2), rgba(0, 0, 200, 0)),
    #ffffff;
}
#sky-dusk {
  background:
    linear-gradient(240deg, rgba(150, 60, 140, 0.5), rgba(255, 160, 70, 0.12)),
    linear-gradient(120deg, rgba(255, 110, 80, 0.45), rgba(90, 50, 120, 0.15)),
    linear-gradient(0deg, rgba(255, 140, 60, 0.5), rgba(120, 60, 130, 0.1)),
    #F3C9A0;
}
#sky-night {
  background:
    linear-gradient(240deg, rgba(70, 40, 90, 0.5), rgba(10, 14, 26, 0)),
    linear-gradient(120deg, rgba(30, 60, 90, 0.45), rgba(10, 14, 26, 0)),
    linear-gradient(0deg, rgba(20, 30, 70, 0.55), rgba(10, 14, 26, 0)),
    #0A0E1A;
}
/* Stack layers to prevent transparent holes during crossfades */
body.dusk #sky-dusk { opacity: 1; }
body.night #sky-dusk { opacity: 1; }
body.night #sky-night { opacity: 1; }

.container {
  display: -webkit-box;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
          flex-direction: column;
  -webkit-box-align: center;
          align-items: center;
  -webkit-box-pack: center;
          justify-content: center;
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  position: relative;
  z-index: 1; /* above the fixed sky panes */
  background: transparent;
}

nav ul {
  margin: 20px 20px 0 20px;
  list-style-type: none;
  padding: 0;
  display: -webkit-box;
  display: flex;
  -webkit-box-orient: horizontal;
  -webkit-box-direction: normal;
          flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 100%;
}
nav li a {
  display: block;
  width: clamp(38px, 11vw, 50px);
  text-align: center;
  color: #aaa;
  cursor: pointer;
}
nav li a:hover {
  color: #444;
}
nav li a.active {
  color: #4444ff;
}
/* Nothing on the map is doing that right now — say so on the button itself
   rather than quietly showing a different sky. */
nav li a.notfound,
body.night nav li a.notfound {
  color: #e0524f !important;
  animation: iconShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes iconShake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-3px); }
  40%, 60% { transform: translateX(3px); }
}

#card {
  box-shadow: 9px 7px 40px -6px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  /* Shrinks to fit a narrow window instead of pushing the page sideways. The
     engine re-measures the card on resize, so the scene follows it down. */
  width: min(300px, calc(100vw - 48px));
  padding: 0;
  height: min(400px, calc((100vw - 48px) * 4 / 3));
  min-height: 260px;
  margin: 20px;
  border-radius: 5px;
  position: relative;
}
#card .details {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  color: #888;
  display: -webkit-box;
  display: flex;
  -webkit-box-orient: horizontal;
  -webkit-box-direction: normal;
          flex-direction: row;
  -webkit-box-pack: justify;
          justify-content: space-between;
  -webkit-transition: color 2s ease;
  transition: color 2s ease;
}
.thunder #card .details {
  color: #ddd;
}
#card .details .right {
  text-align: right;
}
#card .details #date {
  margin: 4px 0;
}
#card .details #summary {
  font-weight: 600;
  font-size: 22px;
}
#card .details .temp {
  font-size: 60px;
  line-height: 60px;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.2s ease;
}
#card .details .temp:hover {
  opacity: 0.65;
}
#card .details .temp span {
  font-size: 18px;
  line-height: 30px;
  vertical-align: top;
  margin-left: 5px;
}

.weather {
  background-color: #DAE3FD;
  -webkit-transition: background-color 2s ease;
  transition: background-color 2s ease;
}
.thunder .weather {
  background-color: #9FA4AD;
}
.rain .weather {
  background-color: #D8D8D8;
}
.sun .weather {
  background-color: #ccccff;
}
.cloud .weather {
  background-color: #C4CBD6;
}

/* Location line + live badge, sitting above the temperature */
#card .details #place {
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0;
  transition: opacity 1s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 145px;
}
#card .details #place.shown {
  opacity: 1;
}
/* The place name links out to weather.com, but it should read as part of the
   card, not as a stock blue hyperlink. */
#card .details #place a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s ease, color 0.3s ease;
}
#card .details #place a:hover {
  color: #4444ff;
  border-bottom-color: currentColor;
}
.thunder #card .details #place a:hover {
  color: #fff;
}
#card .details .temp {
  transition: opacity 0.6s ease;
}
#card .details.loading .temp,
#card .details.loading #date {
  opacity: 0.35;
}

/* The date has to survive "Wednesday 21 September" without wrapping, so the
   day name is abbreviated and the line is pinned to one row. */
#card .details #date {
  white-space: nowrap;
}
/* That city's own wall clock, not the visitor's */
#card .details #localtime {
  white-space: nowrap;
  font-size: 13px;
  letter-spacing: 0.06em;
  opacity: 0.75;
  margin-bottom: 4px;
}

/* Search — type a city and the card flies to it */
#search {
  position: relative;
  margin: 18px 20px 0 20px;
  display: flex;
  gap: 8px;
  align-items: center;
  max-width: calc(100% - 40px);
}
/* Home — jumps back to the visitor's own city from wherever they wandered to */
#home {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.65);
  color: #888;
  cursor: pointer;
  transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
}
#home:hover {
  color: #4444ff;
  border-color: #4444ff;
  background: rgba(255, 255, 255, 0.9);
}
#home svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Zen — same circular affordance as home, on the other side of the field */
#zen {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.65);
  color: #888;
  cursor: pointer;
  transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
}
#zen:hover {
  color: #4444ff;
  border-color: #4444ff;
  background: rgba(255, 255, 255, 0.9);
}
#zen svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Zen mode ──────────────────────────────────────────────────────────────
   Everything but the sky gets out of the way. The animation keeps running and
   refreshing underneath; a click on the background brings the UI back. */
body.zen nav,
body.zen #search {
  opacity: 0;
  pointer-events: none;
}
/* A literal zoom: the card and both overlay canvases scale by the same factor
   about the same point, so the scene is pixel-for-pixel the regular view, just
   larger. Nothing is re-laid-out, so nothing drifts or clips.

   The scale lands on #card-zoom rather than #card because the lightning tween
   writes an inline transform onto #card, which would win over this. */
#card-zoom {
  transform: scale(1);
  transform-origin: 50% 50%;
}
/* Shelf preview only. A uniform scale keeps the scene pixel-identical to the
   real page — the engine's geometry is untouched, so nothing drifts. */
html.embedded #card-zoom {
  transform: scale(0.68);
}
html.embedded nav ul { margin-top: 8px; }
html.embedded #search { margin-top: 6px; }
#outer, #back {
  transform-origin: var(--zoom-x, 50%) var(--zoom-y, 50%);
}
#card-zoom, #outer, #back {
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
body.zen #card-zoom,
body.zen #outer,
body.zen #back {
  transform: scale(var(--zoom-scale, 1.8));
}
body.zen #card {
  cursor: pointer;
}
body.zen .country-flag {
  opacity: 0;
  pointer-events: none;
}
nav, #search {
  transition: opacity 0.5s ease;
}
#card {
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

#search input {
  font: inherit;
  font-size: 13px;
  padding: 7px 12px;
  width: min(170px, 42vw);
  min-width: 0;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.65);
  outline: none;
  color: #444;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
#search input:focus {
  border-color: #4444ff;
  box-shadow: 0 0 0 3px rgba(68, 68, 255, 0.12);
}
#search input::placeholder {
  color: #999;
}
/* ── City autocomplete ─────────────────────────────────────────────────────
   Liquid glass: a translucent pane that blurs and lifts whatever is behind
   it, with a bright inner rim so it reads as a physical sheet rather than a
   flat panel. Suggestions come from the same geocoder the search uses. */
#city-wrap {
  position: relative;
  display: flex;
}
/* Inline completion. Sits exactly over the input, repeating what you typed in
   transparent text so the faded remainder lines up with the real caret. */
#ghost {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 7px 12px;
  border: 1px solid transparent;
  font: inherit;
  font-size: 13px;
  white-space: pre;
  color: transparent;
  pointer-events: none;
  overflow: hidden;
}
#ghost .rest { color: rgba(30, 30, 60, 0.34); }
body.night #ghost .rest { color: rgba(255, 255, 255, 0.3); }

#suggest {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  z-index: 20;
  margin: 0;
  padding: 5px;
  list-style: none;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(20px) saturate(1.8);
  -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow:
    0 14px 34px -10px rgba(40, 40, 90, 0.35),
    inset 0 1px 1px rgba(255, 255, 255, 0.9),
    inset 0 -8px 18px rgba(255, 255, 255, 0.25);
  opacity: 0;
  transform: translateY(-6px) scale(0.98);
  transform-origin: top center;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
}
#suggest.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
#suggest li {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 7px 11px;
  border-radius: 13px;
  font-size: 13px;
  color: #444;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
}
#suggest li .region {
  font-size: 11px;
  opacity: 0.6;
  margin-left: auto;
  white-space: nowrap;
}
#suggest li:hover,
#suggest li.active {
  background: rgba(255, 255, 255, 0.75);
  color: #1c1c2e;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
}

body.night #suggest {
  background: rgba(30, 40, 66, 0.55);
  border-color: rgba(255, 255, 255, 0.16);
  box-shadow:
    0 14px 34px -10px rgba(0, 0, 0, 0.6),
    inset 0 1px 1px rgba(255, 255, 255, 0.18),
    inset 0 -8px 18px rgba(255, 255, 255, 0.05);
}
body.night #suggest li { color: #B9C6DE; }
body.night #suggest li:hover,
body.night #suggest li.active {
  background: rgba(255, 255, 255, 0.12);
  color: #FFFFFF;
}

/* Sits under the row rather than in it — as a flex item it stole width and
   shunted the search bar off centre whenever a lookup failed. */
#search .err {
  position: absolute;
  top: calc(100% + 9px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  color: #c0392b;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
body.night #search .err { color: #ff8b84; }
#search .err.shown {
  opacity: 1;
}
.weather #inner {
  background-color: white;
  background: -webkit-gradient(linear, left top, left bottom, color-stop(50%, rgba(255, 255, 255, 0.5)), to(rgba(255, 255, 255, 0)));
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0) 100%);
  transition: background var(--sky-fade, 1.4s) ease;
}
.weather .cloud {
  -webkit-transition: fill 2s ease;
  transition: fill 2s ease;
}
.weather #cloud1 {
  fill: #efefef;
}
.thunder .weather #cloud1 {
  fill: #9FA4AD;
}
.weather #cloud2 {
  fill: #E6E6E6;
}
.thunder .weather #cloud2 {
  fill: #8B8E98;
}
.weather #cloud3 {
  fill: #D5D5D5;
}
.thunder .weather #cloud3 {
  fill: #7B7988;
}

#outer, #back {
  position: fixed;
  pointer-events: none;
}

/* ── Dusk ──────────────────────────────────────────────────────────────────
   Going straight from a pale afternoon to midnight is a hard cut, so the
   change routes through a sunset: the page warms to orange, then to violet,
   then settles into night. Every surface transitions on the same curve, and
   the `dusk` stage below is held briefly on the way through. */
body,
body .background,
body .container,
#card,
#card .details,
.weather,
.weather #cloud1,
.weather #cloud2,
.weather #cloud3,
nav li a,
#home, #zen, #search input {
  transition: background-color var(--sky-fade, 1.4s) ease,
              color var(--sky-fade, 1.4s) ease, fill var(--sky-fade, 1.4s) ease, border-color var(--sky-fade, 1.4s) ease,
              box-shadow var(--sky-fade, 1.4s) ease;
}

body.dusk .weather { background-color: #9E7682; }
body.dusk #card .details { color: #FFE8D2; }
body.dusk .weather #cloud1 { fill: #8F6675; }
body.dusk .weather #cloud2 { fill: #7A5566; }
body.dusk .weather #cloud3 { fill: #664354; }

/* ── Night ─────────────────────────────────────────────────────────────────
   Driven by the rendered city's own sunset, not the visitor's clock — look up
   Reykjavik at 2am and you get Reykjavik's night. Everything shifts together:
   page, card, controls, orb and the loading curtain. */
#moon { display: none; }
body.night #sun, body.sunrise #sun { display: none; }
body.night #moon, body.sunrise #moon { display: block; }
/* !important because #sunburst carries an inline fill from the original markup */
body.night #sunburst, body.sunrise #sunburst { fill: url(#SVGID_moon_) !important; }

/* Card faces, one per mood, all pushed down into night */
body.night .weather { background-color: #1B2438; }
body.night .thunder .weather { background-color: #171B26; }
body.night .rain .weather { background-color: #19212F; }
body.night .snow .weather { background-color: #212B40; }
body.night .cloud .weather { background-color: #1A2130; }
body.night .sun .weather { background-color: #232C4A; }
body.night .weather #inner {
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 50%, rgba(255, 255, 255, 0) 100%);
}

/* Clouds read as silhouettes at night rather than white puffs */
body.night .weather #cloud1 { fill: #39445C; }
body.night .weather #cloud2 { fill: #2E384D; }
body.night .weather #cloud3 { fill: #242C3E; }
body.night .thunder .weather #cloud1 { fill: #2B3040; }
body.night .thunder .weather #cloud2 { fill: #222733; }
body.night .thunder .weather #cloud3 { fill: #1A1E28; }

body.night #card { box-shadow: 0 18px 50px -8px rgba(0, 0, 0, 0.7); }
body.night #card .details { color: #A8B4CC; }
body.night .thunder #card .details { color: #C9D3E6; }
body.night #card .details #place a:hover { color: #8FB4FF; }

/* The clear-sky button becomes a moon at night (weather-icons wi-night-clear) */
body.night #button-sun .wi-day-sunny:before { content: "\f02e"; }

body.night nav li a { color: #5A6684; }
body.night nav li a:hover { color: #C3CEE6; }
body.night nav li a.active { color: #8FB4FF; }

body.night #home,
body.night #zen,
body.night #search input {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.14);
  color: #A8B4CC;
}
body.night #search input::placeholder { color: #64708C; }
body.night #home:hover,
body.night #zen:hover {
  color: #8FB4FF;
  border-color: #8FB4FF;
  background: rgba(255, 255, 255, 0.1);
}
body.night #search input:focus {
  border-color: #8FB4FF;
  box-shadow: 0 0 0 3px rgba(143, 180, 255, 0.16);
}

/* The loading curtain matches whatever the page is about to become */
body.night #loader {
  background:
    linear-gradient(240deg, rgba(70, 40, 90, 0.5), rgba(10, 14, 26, 0)),
    linear-gradient(120deg, rgba(30, 60, 90, 0.45), rgba(10, 14, 26, 0)),
    linear-gradient(0deg, rgba(20, 30, 70, 0.55), rgba(10, 14, 26, 0)),
    #0A0E1A;
}
body.night #loader li {
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow:
    0 4px 16px rgba(var(--wx-rgb), 0.45),
    inset 0 1px 2px rgba(255, 255, 255, 0.3),
    inset 0 -2px 6px rgba(var(--wx-rgb), 0.5);
}
body.night #loader.wx-snow li::after {
  background: linear-gradient(180deg, #dce8f8 0%, #b9cbe4 100%);
}

/* ── Loading curtain ───────────────────────────────────────────────────────
   Same bouncing-bars loader as the /ig, /li … redirect pages. It starts in a
   neutral slate, then takes on the colour of the sky it just fetched — so the
   loader tells you the weather a beat before the card does. */
#loader {
  --wx-rgb: 150, 158, 170;
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  /* The same gradient stack the page itself sits on, so the curtain reads as
     the page holding its breath rather than a separate white screen. */
  background:
    linear-gradient(240deg, rgba(150, 50, 50, 0.3), rgba(0, 0, 200, 0)),
    linear-gradient(120deg, rgba(50, 150, 100, 0.2), rgba(0, 0, 100, 0)),
    linear-gradient(0deg, rgba(0, 0, 200, 0.2), rgba(0, 0, 200, 0)),
    #eee;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
/* The bars stay invisible until the weather is known, so they only ever
   appear already wearing the right colour and animation. */
#loader ul, #loader .glow {
  opacity: 0;
  transition: opacity 0.5s ease;
}
#loader.in ul, #loader.in .glow {
  opacity: 1;
}
#loader.out {
  opacity: 0;
  visibility: hidden;
}
#loader .glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--wx-rgb), 0.3) 0%, transparent 70%);
  filter: blur(20px);
  transition: background 0.6s ease;
}
#loader ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  align-items: center;
  position: relative;
}
#loader li {
  position: relative;
  margin: 0 7px;
  width: 12px;
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%),
              linear-gradient(180deg, rgba(var(--wx-rgb), 0.9) 0%, rgba(var(--wx-rgb), 0.6) 100%);
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow:
    0 4px 12px rgba(var(--wx-rgb), 0.3),
    inset 0 1px 2px rgba(255, 255, 255, 0.9),
    inset 0 -2px 6px rgba(var(--wx-rgb), 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  transition: background 0.6s ease, box-shadow 0.6s ease;

   load-in jitter while every bar sits at the same height. */
#loader li:nth-child(odd) { animation-delay: -0.8s; }
#loader li:nth-child(even) { animation-delay: 0s; }

@keyframes loaderBar {
  from { height: 12px; }
  to { height: 80px; }
}

/* Storms rattle the whole rig, and the bars strobe like distant lightning. */
#loader.storm ul {
  animation: loaderShake 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
}
#loader.storm li {
  animation: loaderBar 0.45s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate,
             loaderStrike 1.4s steps(1, end) infinite;
}
#loader.storm li:nth-child(odd) { animation-delay: -0.45s, 0.2s; }
#loader.storm li:nth-child(even) { animation-delay: 0s, 0.7s; }

@keyframes loaderShake {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(-3px, 1px) rotate(-0.6deg); }
  50% { transform: translate(2px, -2px) rotate(0.5deg); }
  75% { transform: translate(-1px, 2px) rotate(-0.3deg); }
}
@keyframes loaderStrike {
  0%, 88% { filter: none; }
  90%, 94% { filter: brightness(2.4) saturate(0.4); }
  92% { filter: none; }
}

/* Wind — the whole rig leans right and shivers, bracing against a gust. */
#loader.wx-wind ul {
  animation: loaderLean 1.9s ease-in-out infinite;
  transform-origin: 50% 100%;
}
#loader.wx-wind li {
  animation: loaderBar 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate,
             loaderShiver 0.22s ease-in-out infinite;
}
#loader.wx-wind li:nth-child(odd) { animation-delay: -0.6s, -0.11s; }
#loader.wx-wind li:nth-child(even) { animation-delay: 0s, 0s; }
@keyframes loaderLean {
  0%, 100% { transform: skewX(-7deg) translateX(0); }
  50% { transform: skewX(-15deg) translateX(5px); }
}
@keyframes loaderShiver {
  0%, 100% { margin-left: 7px; margin-right: 7px; }
  50% { margin-left: 8px; margin-right: 6px; }
}

/* Snow — a cap of settled snow rides the top of every bar. */
#loader.wx-snow li::after {
  content: '';
  position: absolute;
  top: -4px;
  left: -3px;
  right: -3px;
  height: 9px;
  border-radius: 60% 60% 45% 45% / 85% 85% 25% 25%;
  background: linear-gradient(180deg, #ffffff 0%, #eef5fc 100%);
  box-shadow: 0 1px 3px rgba(70, 100, 130, 0.18);
}

/* Rain — glassy bars with droplets running down the face of each one. */
#loader.wx-rain li {
  background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 100%),
              linear-gradient(180deg, rgba(var(--wx-rgb), 0.95) 0%, rgba(var(--wx-rgb), 0.55) 100%);
  box-shadow:
    0 6px 16px rgba(var(--wx-rgb), 0.38),
    inset 0 2px 3px rgba(255, 255, 255, 0.95),
    inset 0 -3px 8px rgba(var(--wx-rgb), 0.5);
}
#loader.wx-rain li::before {
  content: '';
  position: absolute;
  left: 50%;
  width: 6px;
  height: 7px;
  margin-left: -3px;
  border-radius: 60% 60% 55% 55% / 75% 75% 35% 35%;
  background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 100%);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14), inset 0 -1px 2px rgba(var(--wx-rgb), 0.55);
  animation: loaderDrip 1.5s cubic-bezier(0.5, 0, 0.9, 0.6) infinite;
}
#loader.wx-rain li:nth-child(2)::before { animation-delay: 0.55s; }
#loader.wx-rain li:nth-child(3)::before { animation-delay: 1.1s; }
#loader.wx-rain li:nth-child(4)::before { animation-delay: 0.3s; }
#loader.wx-rain li:nth-child(5)::before { animation-delay: 0.85s; }
#loader.wx-rain li:nth-child(6)::before { animation-delay: 1.35s; }
#loader.wx-rain li:nth-child(7)::before { animation-delay: 0.15s; }
@keyframes loaderDrip {

  18% { opacity: 1; transform: scale(1); }
  80% { opacity: 1; transform: scale(1); }

}

}

<script id="rendered-js">
// 📝 Fetch all DOM nodes in jQuery and Snap SVG

var container = $('.container');
var card = $('#card');
var innerSVG = Snap('#inner');
var outerSVG = Snap('#outer');
var backSVG = Snap('#back');
var summary = $('#summary');
var date = $('#date');
var weatherContainer1 = Snap.select('#layer1');
var weatherContainer2 = Snap.select('#layer2');
var weatherContainer3 = Snap.select('#layer3');
var innerRainHolder1 = weatherContainer1.group();
var innerRainHolder2 = weatherContainer2.group();
var innerRainHolder3 = weatherContainer3.group();
var innerLeafHolder = weatherContainer1.group();
var innerSnowHolder = weatherContainer1.group();
var innerLightningHolder = weatherContainer1.group();
var leafMask = outerSVG.rect();
var leaf = Snap.select('#leaf');
// The orb group, not the sun itself — every position tween below drives both
// the sun and the moon, and CSS picks which is showing.
var sun = Snap.select('#orb');
var sunburst = Snap.select('#sunburst');
var outerSplashHolder = outerSVG.group();
var outerLeafHolder = outerSVG.group();
var outerSnowHolder = outerSVG.group();

var lightningTimeout;

// Set mask for leaf holder 

outerLeafHolder.attr({
  'clip-path': leafMask });


// create sizes object, we update this later

var sizes = {
  container: { width: 0, height: 0 },
  card: { width: 0, height: 0 } };


// grab cloud groups

var clouds = [
{ group: Snap.select('#cloud1') },
{ group: Snap.select('#cloud2') },
{ group: Snap.select('#cloud3') }];


// set weather types ☁️ 🌬 🌧 ⛈ ☀️

var weather = [
{ type: 'snow', name: 'Snow' },
{ type: 'wind', name: 'Windy' },
{ type: 'rain', name: 'Rain' },
{ type: 'thunder', name: 'Storms' },
{ type: 'cloud', name: 'Cloudy' },
{ type: 'sun', name: 'Sunny' }];


// 🛠 app settings
// in an object so the values can be animated in tweenmax

var settings = {
  windSpeed: 2,
  rainCount: 0,
  leafCount: 0,
  snowCount: 0,
  cloudHeight: 100,
  cloudSpace: 30,
  cloudArch: 50,
  renewCheck: 10,
  splashBounce: 80 };


var tickCount = 0;
var rain = [];
var leafs = [];
var snow = [];

// ⚙ initialize app

init();

// 👁 watch for window resize

$(window).resize(onResize);

// 🏃 start animations

requestAnimationFrame(tick);

function init()
{
  onResize();

  // 🖱 bind weather menu buttons

  for (var i = 0; i < weather.length; i++)
  {
    var w = weather[i];
    var b = $('#button-' + w.type);
    w.button = b;
    b.bind('click', w, changeWeather);
  }

  // ☁️ draw clouds

  for (var i = 0; i < clouds.length; i++)
  {
    clouds[i].offset = Math.random() * sizes.card.width;
    drawCloud(clouds[i], i);
  }

  // ☀️ set initial weather

  // Neutral holding state — the live fetch swaps this the moment it lands,
  // so the card never flashes a season it isn't.
  TweenMax.set(sunburst.node, { opacity: 0 });
  changeWeather(weather[4]);
}

function onResize()
{
  // 📏 grab window and card sizes 

  sizes.container.width = container.width();
  sizes.container.height = container.height();
  sizes.card.width = card.width();
  sizes.card.height = card.height();
  sizes.card.offset = card.offset();

  // 📐 update svg sizes

  innerSVG.attr({
    width: sizes.card.width,
    height: sizes.card.height });


  outerSVG.attr({
    width: sizes.container.width,
    height: sizes.container.height });


  backSVG.attr({
    width: sizes.container.width,
    height: sizes.container.height });


  TweenMax.set(sunburst.node, { transformOrigin: "50% 50%", x: sizes.container.width / 2, y: sizes.card.height / 2 + sizes.card.offset.top });
  TweenMax.fromTo(sunburst.node, 20, { rotation: 0 }, { rotation: 360, repeat: -1, ease: Power0.easeInOut });
  // 🍃 The leaf mask is for the leafs that float out of the
  // container, it is full window height and starts on the left
  // inline with the card

  leafMask.attr({ x: sizes.card.offset.left, y: 0, width: sizes.container.width - sizes.card.offset.left, height: sizes.container.height });
}

function drawCloud(cloud, i)
{
  /* 
  
  ☁️ We want to create a shape thats loopable but that can also
  be animated in and out. So we use Snap SVG to draw a shape
  with 4 sections. The 2 ends and 2 arches the same width as
  the card. So the final shape is about 4 x the width of the
  card.
  
  */

  var space = settings.cloudSpace * i;
  var height = space + settings.cloudHeight;
  var arch = height + settings.cloudArch + Math.random() * settings.cloudArch;
  var width = sizes.card.width;

  var points = [];
  points.push('M' + [-width, 0].join(','));
  points.push([width, 0].join(','));
  points.push('Q' + [width * 2, height / 2].join(','));
  points.push([width, height].join(','));
  points.push('Q' + [width * 0.5, arch].join(','));
  points.push([0, height].join(','));
  points.push('Q' + [width * -0.5, arch].join(','));
  points.push([-width, height].join(','));
  points.push('Q' + [-(width * 2), height / 2].join(','));
  points.push([-width, 0].join(','));

  var path = points.join(' ');
  if (!cloud.path) cloud.path = cloud.group.path();
  cloud.path.animate({
    d: path },
  0);
}

function makeRain()
{
  // 💧 This is where we draw one drop of rain

  // first we set the line width of the line, we use this
  // to dictate which svg group it'll be added to and 
  // whether it'll generate a splash

  var lineWidth = Math.random() * 3;

  // ⛈ line length is made longer for stormy weather

  var lineLength = currentWeather.type == 'thunder' ? 35 : 14;

  // Start the drop at a random point at the top but leaving 
  // a 20px margin 

  var x = Math.random() * (sizes.card.width - 40) + 20;

  // Draw the line

  var line = this['innerRainHolder' + (3 - Math.floor(lineWidth))].path('M0,0 0,' + lineLength).attr({
    fill: 'none',
    stroke: currentWeather.type == 'thunder' ? '#777' : '#0000ff',
    strokeWidth: lineWidth });


  // add the line to an array to we can keep track of how
  // many there are.

  rain.push(line);

  // Start the falling animation, calls onRainEnd when the 
  // animation finishes.

  TweenMax.fromTo(line.node, 1, { x: x, y: 0 - lineLength }, { delay: Math.random(), y: sizes.card.height, ease: Power2.easeIn, onComplete: onRainEnd, onCompleteParams: [line, lineWidth, x, currentWeather.type] });
}

function onRainEnd(line, width, x, type)
{
  // first lets get rid of the drop of rain 💧

  line.remove();
  line = null;

  // We also remove it from the array

  for (var i in rain)
  {
    if (!rain[i].paper) rain.splice(i, 1);
  }

  // If there is less rain than the rainCount we should
  // make more.

  if (rain.length < settings.rainCount)
  {
    makeRain();

    // 💦 If the line width was more than 2 we also create a 
    // splash. This way it looks like the closer (bigger) 
    // drops hit the the edge of the card

    if (width > 2) makeSplash(x, type);
  }
}

function makeSplash(x, type)
{
  // 💦 The splash is a single line added to the outer svg.

  // The splashLength is how long the animated line will be
  var splashLength = type == 'thunder' ? 30 : 20;

  // splashBounce is the max height the line will curve up
  // before falling
  var splashBounce = type == 'thunder' ? 120 : 100;

  // this sets how far down the line can fall
  var splashDistance = 80;

  // because the storm rain is longer we want the animation
  // to last slighly longer so the overall speed is roughly
  // the same for both
  var speed = type == 'thunder' ? 0.7 : 0.5;

  // Set a random splash up amount based on the max splash bounce
  var splashUp = 0 - Math.random() * splashBounce;

  // Sets the end x position, and in turn defines the splash direction
  var randomX = Math.random() * splashDistance - splashDistance / 2;

  // Now we put the 3 line coordinates into an array. 

  var points = [];
  points.push('M' + 0 + ',' + 0);
  points.push('Q' + randomX + ',' + splashUp);
  points.push(randomX * 2 + ',' + splashDistance);

  // Draw the line with Snap SVG

  var splash = outerSplashHolder.path(points.join(' ')).attr({
    fill: "none",
    stroke: type == 'thunder' ? '#777' : '#0000ff',
    strokeWidth: 1 });


  // We animate the dasharray to have the line travel along the path 

  var pathLength = Snap.path.getTotalLength(splash);
  var xOffset = sizes.card.offset.left; //(sizes.container.width - sizes.card.width) / 2
  var yOffset = sizes.card.offset.top + sizes.card.height;
  splash.node.style.strokeDasharray = splashLength + ' ' + pathLength;

  // Start the splash animation, calling onSplashComplete when finished
  TweenMax.fromTo(splash.node, speed, { strokeWidth: 2, y: yOffset, x: xOffset + 20 + x, opacity: 1, strokeDashoffset: splashLength }, { strokeWidth: 0, strokeDashoffset: -pathLength, opacity: 1, onComplete: onSplashComplete, onCompleteParams: [splash], ease: SlowMo.ease.config(0.4, 0.1, false) });
}

function onSplashComplete(splash)
{
  // 💦 The splash has finished animating, we need to get rid of it

  splash.remove();
  splash = null;
}

function makeLeaf()
{
  var scale = 0.5 + Math.random() * 0.5;
  var newLeaf;

  var areaY = sizes.card.height / 2;
  var y = areaY + Math.random() * areaY;
  var endY = y - (Math.random() * (areaY * 2) - areaY);
  var x;
  var endX;
  var colors = ['#76993E', '#4A5E23', '#6D632F'];
  var color = colors[Math.floor(Math.random() * colors.length)];
  var xBezier;

  if (scale > 0.8)
  {
    newLeaf = leaf.clone().appendTo(outerLeafHolder).
    attr({
      fill: color });

    y = y + sizes.card.offset.top / 2;
    endY = endY + sizes.card.offset.top / 2;

    x = sizes.card.offset.left - 100;
    xBezier = x + (sizes.container.width - sizes.card.offset.left) / 2;
    endX = sizes.container.width + 50;

  switch (weather.type) {

      TweenMax.to(settings, 1, { snowCount: 0, ease: Power2.easeOut });

  // sun position

  switch (weather.type) {

    case 'sun':
      var sunProps = { x: sizes.card.width / 2, ease: Power2.easeInOut };
      var burstProps = { scale: 1, opacity: 0.8, ease: Power2.easeInOut };

            loc: {
              lat: r.latitude,
              lon: r.longitude,
              place: region ? r.name + ', ' + region : r.name,
              countryCode: r.country_code,
              countryName: r.country,
              imperial: IMPERIAL.indexOf(r.country_code) !== -1
            }
          };
        });
        if (hits.length) renderSuggest();
      }, function () { /* keep whatever the local list already showed */ });
    }, 180);
  });

  $cityInput.on('blur', function () { setTimeout(closeSuggest, 120); });

  $cityInput.on('keydown', function (e) {
    if (e.which === 27) return closeSuggest(); // Esc

    // Tab accepts the faded completion rather than leaving the field.
    if (e.which === 9) {
      var full = ghostTarget();
      if (!full) return;
      e.preventDefault();
      $cityInput.val(full);
      paintGhost();
      return;
    }

    if (hits.length && (e.which === 38 || e.which === 40)) {
      e.preventDefault();
      activeIdx = e.which === 40
        ? (activeIdx + 1) % hits.length
        : (activeIdx <= 0 ? hits.length - 1 : activeIdx - 1);
      paintActive();
      return;
    }

    if (e.which !== 13) return;
    if (activeIdx >= 0) return choose(activeIdx); // Enter takes the highlighted city
    var q = $cityInput.val().trim();
    $cityInput.blur();
    closeSuggest();
    load(q);
  });

  /* A deep link (the terminal's "see more") opens on that place,
     curtain and all, then the parameters are stripped so a refresh still
     resets to home.

     Coordinates are preferred over a name: the terminal's city list holds
     exact points, and re-geocoding the label would quietly land somewhere
     else — searching "Cape Horn" finds one in California long before the
     one off Chile. */
  var params = new URLSearchParams(window.location.search);
  var deepLat = parseFloat(params.get('lat'));
  var deepLon = parseFloat(params.get('lon'));
  var deepName = (params.get('name') || '').trim();
  var deepLink = (params.get('q') || '').trim();
  
  var accessedViaTerminal = !!window.location.search;

  if (window.history && history.replaceState && window.location.search) {
    history.replaceState(null, '', window.location.pathname);
  }

  if (!isNaN(deepLat) && !isNaN(deepLon)) {
    $cityInput.val(deepName.split(',')[0]);
    load(deepName, false, true, {
      lat: deepLat,
      lon: deepLon,
      place: deepName || 'Somewhere',
      imperial: params.get('imp') === '1'
    });
  } else {
    if (deepLink) $cityInput.val(deepLink);
    load(deepLink, false, true);
  }

  // On mobile, start the page in hidden UI mode until the background is tapped, 
  // UNLESS it was accessed via the terminal (which sets query params).
  if (window.innerWidth <= 768 && !accessedViaTerminal) {
    setTimeout(function() { setZen(true); }, 10);
  }

  // Conditions drift slowly; a refresh every 10 minutes is plenty, and only
  // while the tab is actually being looked at.
  setInterval(function () {
    if (!document.hidden && !$live.hasClass('manual')) load(currentQuery, true);
  }, 600000);

})();
</script>
</body>
</html>
